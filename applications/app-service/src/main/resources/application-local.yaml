server:
  port: 8080
spring:
  application:
    name: "franchise_inventory_api"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  # profiles:
  #   include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
# Fixed dev API Credential (curl -u inventory-client:<password>); never use it outside local development
security:
  client:
    username: "inventory-client"
    password: "local-dev-only-api-credential-do-not-use-in-aws"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: "localhost"
    port: 5435
    database: "franchise_inventory"
    schema: "public"
    username: "postgres"
    password: "postgres"
    ssl-mode: "disable"
