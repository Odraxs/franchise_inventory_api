server:
  port: 8080
spring:
  application:
    name: "franchise_inventory_api"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  flyway:
    # Reuses the R2DBC settings, so the local profile and ADAPTERS_R2DBC_* env vars both apply
    url: "jdbc:postgresql://${adapters.r2dbc.host}:${adapters.r2dbc.port}/${adapters.r2dbc.database}"
    user: "${adapters.r2dbc.username}"
    password: "${adapters.r2dbc.password}"
    schemas: "${adapters.r2dbc.schema:public}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
# Resilience for every database call (DatabaseResilience); reasoning for each value in CODE-QA §9
resilience4j:
  circuitbreaker:
    instances:
      database:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # Infrastructure errors only, so a business error in one operation cannot open it for every endpoint
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.DataAccessResourceFailureException
  timelimiter:
    instances:
      database:
        # Includes the wait for a pool connection
        timeout-duration: 2s
  retry:
    instances:
      databaseIdempotent:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        # Reads, the soft delete and renames are safe to repeat, so a Timeout is retried too
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.TransientDataAccessException
      databaseNonIdempotent:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        # Connection-level errors only: an INSERT that timed out may already be committed
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessResourceException
# API Credential of the single trusted Client: every profile must set both, or the app does not start
security:
  client:
    username:
    password:
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: 
    port:
    database: 
    schema:
    username: 
    password: 