server:
  port: 8080
spring:
  application:
    name: "franchise_inventory_api"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  flyway:
    # Reuses the R2DBC settings, so the local profile and ADAPTERS_R2DBC_* env vars both apply
    url: "jdbc:postgresql://${adapters.r2dbc.host}:${adapters.r2dbc.port}/${adapters.r2dbc.database}"
    user: "${adapters.r2dbc.username}"
    password: "${adapters.r2dbc.password}"
    schemas: "${adapters.r2dbc.schema:public}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: 
    port:
    database: 
    schema:
    username: 
    password: 