# Cloud profile. The container gets only non-secret variables: SPRING_PROFILES_ACTIVE=aws,
# DB_SECRET_NAME, API_SECRET_NAME and AWS_REGION (the SDK region chain reads it; nothing here names a region).
spring:
  config:
    # Reads both secrets once at startup; ";" separates them, and each one has its own prefix.
    # - DB Secret (JSON with the RDS keys host, port, dbname, username, password): "?prefix=db."
    #   prepends "db." to every key, so the secret key "host" becomes "db.host".
    # - API Secret (JSON with the keys username, password): "?prefix=security.client." binds the
    #   API Credential straight to security.client.username and security.client.password.
    import: "aws-secretsmanager:${DB_SECRET_NAME}?prefix=db.;${API_SECRET_NAME}?prefix=security.client."
  cloud:
    aws:
      secretsmanager:
        # application.yaml turns the integration off; only this profile needs AWS.
        enabled: true
cors:
  # No frontend is planned, so no cross-origin call is allowed. An empty value binds to an empty list.
  allowed-origins: ""
adapters:
  r2dbc:
    # Flyway reads the same values through spring.flyway in application.yaml.
    host: "${db.host}"
    port: "${db.port}"
    database: "${db.dbname}"
    schema: "public"
    username: "${db.username}"
    password: "${db.password}"
    ssl-mode: "require"
